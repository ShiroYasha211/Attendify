name: Validate and deploy backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run reviewed database migrations (backup required first)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.2'
          extensions: gd, mbstring, zip, dom, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Validate dependencies and shell script
        run: |
          composer validate --no-check-publish
          bash -n scripts/deploy-production.sh
          git ls-files -z '*.php' | xargs -0 -r -n 1 php -l > /dev/null
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Run focused backend regression tests
        run: php vendor/bin/phpunit tests/Feature/FlashcardSchedulingTest.php tests/Feature/FlashcardImportAndEditingTest.php
      - name: Check Excel runtime
        run: php artisan flashcards:check-import --no-ansi

  deploy:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure verified SSH connection
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          [[ "$HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$PORT" =~ ^[0-9]+$ ]] && (( PORT > 0 && PORT < 65536 ))
          [[ "$USER" != root ]] || { echo 'Use a dedicated deployment user, not root.'; exit 1; }
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host production\n HostName %s\n User %s\n Port %s\n IdentityFile ~/.ssh/deploy_key\n IdentitiesOnly yes\n BatchMode yes\n StrictHostKeyChecking yes\n ConnectTimeout 15\n ServerAliveInterval 30\n ServerAliveCountMax 5\n' "$HOST" "$USER" "$PORT" > ~/.ssh/config
      - name: Deploy exact validated commit
        env:
          TARGET_SHA: ${{ github.sha }}
          RUN_MIGRATIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrations && 'true' || 'false' }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          ssh production "bash -s -- $TARGET_SHA $RUN_MIGRATIONS" < scripts/deploy-production.sh
      - name: Verify public application health
        run: curl --fail --silent --show-error --retry 4 --retry-delay 5 --max-time 30 https://moeen.tech/up
      - name: Remove ephemeral SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config ~/.ssh/known_hosts
